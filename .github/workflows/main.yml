name: nextjs-web-app-flow
on:
  push:
    branches:
      - main
jobs:
  say-hello-in-bash:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello World of Bash"
  say-hello-world-from-python:
    runs-on: ubuntu-latest
    steps:
      - run: print("hello_world in Python Scirpt")
        shell: python
  say-hello-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/next-web-app
        with:
          who-to-greet: "Hello Real World"
