name: nextjs-web-app-flow
on:
  push:
    branches:
      - main
jobs:
  say_hello_in_bash:
    runs-on: ubuntu-latest
    steps:
      - run: echo "BASH: hello_world from bash"
  say_hello_from_python:
    runs-on: ubuntu-latest
    steps:
      - run: print("hello_world in Python Scirpt")
      - shell: python
